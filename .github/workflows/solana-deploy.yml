name: Solana Anchor Build & Deploy Pipeline ⚡

on:
  workflow_dispatch:
    inputs:
      cluster:
        description: 'Target Solana Cluster'
        required: true
        default: 'devnet'
        type: choice
        options:
          - devnet
          - mainnet
          - build-only

jobs:
  build-and-deploy:
    name: Build & Deploy (${{ github.event.inputs.cluster }})
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🦀 Setup Rust Toolchain (Stable with Edition 2024 support)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: 📦 Install Solana CLI (Stable Agave Release)
        run: |
          echo "Installing latest stable Solana CLI..."
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          ln -sf $HOME/.local/share/solana/install/active_release/bin/cargo-build-sbf $HOME/.local/share/solana/install/active_release/bin/cargo-build-bpf || true

      - name: ⚓ Install Anchor CLI
        run: |
          echo "Installing Anchor CLI v0.30.1..."
          npm install -g @coral-xyz/anchor-cli@0.30.1
          which anchor || echo "Anchor installed in npm global path"

      - name: 🔑 Configure Deployer Keypair
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          mkdir -p ~/.config/solana
          if [ "${{ github.event.inputs.cluster }}" = "mainnet" ]; then
            if [ -z "${{ secrets.SOLANA_DEPLOYER_KEY }}" ]; then
              echo "::error::SOLANA_DEPLOYER_KEY secret is not set! Required for mainnet deployment."
              exit 1
            fi
            echo "${{ secrets.SOLANA_DEPLOYER_KEY }}" > ~/.config/solana/id.json
          else
            echo "Generating fresh keypair for ${{ github.event.inputs.cluster }}..."
            solana-keygen new --no-bip39-passphrase --silent -o ~/.config/solana/id.json --force
          fi
          solana-keygen pubkey ~/.config/solana/id.json

      - name: 🔨 Build Anchor Programs
        working-directory: contracts/solana
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.cargo/bin:$PATH"
          ln -sf $(which cargo-build-sbf) $(dirname $(which cargo-build-sbf))/cargo-build-bpf || true
          echo "Solana version: $(solana --version)"
          echo "Anchor version: $(anchor --version || true)"
          echo "Rustc version : $(rustc --version)"
          rm -f Cargo.lock
          anchor build

      - name: 📤 Archive Compiled BPF Binaries & IDLs
        uses: actions/upload-artifact@v4
        with:
          name: solana-compiled-artifacts
          path: |
            contracts/solana/target/deploy/*.so
            contracts/solana/target/idl/*.json
          if-no-files-found: warn

      - name: 🌐 Deploy to Solana Devnet
        if: ${{ github.event.inputs.cluster == 'devnet' }}
        working-directory: contracts/solana
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.cargo/bin:$PATH"
          solana config set --url https://api.devnet.solana.com
          PUBKEY=$(solana-keygen pubkey ~/.config/solana/id.json)
          echo "Deployer Address: $PUBKEY"
          
          echo "Requesting Devnet Airdrop..."
          solana airdrop 2 $PUBKEY || solana airdrop 1 $PUBKEY || echo "Airdrop rate limit reached, continuing..."
          solana balance $PUBKEY
          
          echo "Deploying via Anchor..."
          anchor deploy --provider.cluster devnet || true
          echo "Devnet deploy execution finished."

      - name: 🚀 Deploy to Solana Mainnet
        if: ${{ github.event.inputs.cluster == 'mainnet' }}
        working-directory: contracts/solana
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.cargo/bin:$PATH"
          solana config set --url https://api.mainnet-beta.solana.com
          PUBKEY=$(solana-keygen pubkey ~/.config/solana/id.json)
          echo "Mainnet Deployer Address: $PUBKEY"
          solana balance $PUBKEY
          
          echo "Deploying via Anchor to Mainnet..."
          anchor deploy --provider.cluster mainnet
