name: Publish to npm

on:
  push:
    branches:
      - main
    paths:
      - 'packages/plugin-security-gate/**'
      - '.github/workflows/npm-publish.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Upgrade npm to latest
        run: npm install -g npm@latest

      - name: Install and Build Plugin
        working-directory: packages/plugin-security-gate
        run: |
          bun install
          bun run build
          bun test

      - name: Publish package to npm
        id: publish_step
        continue-on-error: true
        working-directory: packages/plugin-security-gate
        run: |
          npm publish --access public --provenance > publish.log 2>&1 || npm publish --access public > publish.log 2>&1

      - name: Record Publish Log
        if: steps.publish_step.outcome != 'success'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -b ci-debug
          git add packages/plugin-security-gate/publish.log
          git commit -m "ci: capture npm publish log"
          git push origin ci-debug --force
          cat packages/plugin-security-gate/publish.log
          exit 1
