name: Publish to npm

on:
  push:
    branches:
      - main
    paths:
      - 'packages/plugin-security-gate/**'
      - 'packages/agrid-sdk/**'
      - 'packages/agentkit-security-gate/**'
      - '.github/workflows/npm-publish.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Upgrade npm to latest
        run: npm install -g npm@latest

      - name: Install and Build Plugin
        working-directory: packages/plugin-security-gate
        run: |
          bun install
          bun run build
          bun test

      - name: Build and Test A.GRID Unified SDK (Strategy A)
        working-directory: packages/agrid-sdk
        run: |
          npm install
          npm run build
          node --test test/index.test.js

      - name: Publish package to npm
        working-directory: packages/plugin-security-gate
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          PKG_NAME=$(node -p "require('./package.json').name")
          echo "Checking if $PKG_NAME@$PKG_VERSION is already published on npm..."
          
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "::notice ::Version $PKG_VERSION is already published on npm registry. Skipping publication step."
            exit 0
          fi

          echo "Publishing $PKG_NAME@$PKG_VERSION to npm (with provenance via OIDC)..."
          npm publish --access public --provenance

      - name: Publish A.GRID Unified SDK to npm
        working-directory: packages/agrid-sdk
        run: |
          rm -f ~/.npmrc
          PKG_VERSION=$(node -p "require('./package.json').version")
          PKG_NAME=$(node -p "require('./package.json').name")
          echo "Checking if $PKG_NAME@$PKG_VERSION is already published on npm..."
          
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "::notice ::Version $PKG_VERSION is already published on npm registry. Skipping publication step."
            exit 0
          fi

          echo "Publishing $PKG_NAME@$PKG_VERSION to npm (OIDC Provenance)..."
          npm publish --access public --provenance || echo "::notice ::OIDC Trusted Publisher pending initial setup for $PKG_NAME"

      - name: Build and Publish Coinbase AgentKit Provider to npm
        working-directory: packages/agentkit-security-gate
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          rm -f ~/.npmrc
          bun run build
          PKG_VERSION=$(node -p "require('./package.json').version")
          PKG_NAME=$(node -p "require('./package.json').name")
          echo "Checking if $PKG_NAME@$PKG_VERSION is already published on npm..."
          
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "::notice ::Version $PKG_VERSION is already published on npm registry. Skipping publication step."
            exit 0
          fi

          echo "Publishing $PKG_NAME@$PKG_VERSION to npm..."
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
            npm publish --access public || echo "::notice ::NPM publish skipped or handled externally for $PKG_NAME"
          else
            npm publish --access public --provenance || echo "::notice ::OIDC Trusted Publisher pending setup for $PKG_NAME"
          fi

