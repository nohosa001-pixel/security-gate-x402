[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-security-gate-x402"
version = "1.1.0"
description = "Ultra-low latency (<10ms) deterministic security, prompt injection, secret leak, dangerous AST, and factual hallucination inspection micro-oracle for autonomous agents on Polygon, Base, and Arbitrum."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Security Gate Team", email = "developer@security-gate-x402.com" }
]
keywords = [
  "ai-agents",
  "security",
  "guardrails",
  "hallucination",
  "x402",
  "attestation",
  "polygon",
  "base",
  "arbitrum",
  "mcp",
  "glama",
  "fastapi"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12"
]
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.28.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "httpx>=0.27.0",
  "web3>=6.15.0",
  "eth-account>=0.11.0",
  "cryptography>=42.0.0",
  "python-dotenv>=1.0.1",
  "mcp>=1.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.urls]
Homepage = "https://github.com/nohosa001-pixel/security-gate-x402"
Repository = "https://github.com/nohosa001-pixel/security-gate-x402"

[project.scripts]
agent-security-gate = "mcp_server:main"
security-gate-mcp = "mcp_server:main"
x402-security-agent = "mcp_server:main"

[tool.setuptools]
py-modules = ["mcp_server"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.txt", ".well-known/*", "static/*", "contracts/*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "sdk*"]
exclude = ["app.__pycache__*", "tests*", "*.pyc"]
