steps:
  # 1. Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/agent-security-gate-x402:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/agent-security-gate-x402:latest', '.']

  # 2. Push image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/agent-security-gate-x402:latest']

  # 3. Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'agent-security-gate-x402'
      - '--image'
      - 'gcr.io/$PROJECT_ID/agent-security-gate-x402:latest'
      - '--region'
      - 'asia-northeast3' # Default: Seoul (or us-central1)
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--command'
      - 'uvicorn'
      - '--args'
      - 'app.main:app,--host,0.0.0.0,--port,8080'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '100'

images:
  - 'gcr.io/$PROJECT_ID/agent-security-gate-x402:latest'
